# Render Blueprint for the public RedCell demo (free web service).
# The build downloads a fixed git tag (REDCELL_TAG), so later pushes to main never change what judges see.
# Secrets are NOT in this file: NEBIUS_API_KEY, TAVILY_API_KEY and REDCELL_RUN_CODE use sync:false, so
# Render asks for them in the dashboard and stores them as secret environment variables.
services:
  - type: web
    name: redcell-demo
    runtime: python
    plan: free
    autoDeploy: false
    # Optional extras, each installed on its own so a failure only switches that feature off (never fails the build):
    # ReportLab for PDF export, langsmith for tracing.
    # Then wipe build/ (Render's build cache can keep an older tag's folder) and unpack into the fixed folder
    # build/app, so the start command never depends on a glob matching exactly one directory.
    buildCommand: >-
      (pip install reportlab==4.4.10 || echo "reportlab install failed: PDF export disabled")
      && (pip install langsmith==0.14.14 || echo "langsmith install failed: tracing disabled")
      && rm -rf build && python -c "import io,os,tarfile,urllib.request as u;
      t=os.environ['REDCELL_TAG'];
      tarfile.open(fileobj=io.BytesIO(u.urlopen('https://codeload.github.com/larptech-70/red-cell/tar.gz/refs/tags/'+t).read())).extractall('build',filter='data')"
      && mv build/red-cell-* build/app
    startCommand: cd build/app && exec python -m redcell.server
    healthCheckPath: /api/info
    envVars:
      - key: REDCELL_TAG
        value: v1.4-submission
      - key: REDCELL_HOST
        value: 0.0.0.0
      - key: REDCELL_PUBLIC
        value: "1"
      - key: REDCELL_RUNS_PER_VISITOR
        value: "2"
      - key: REDCELL_DAILY_BUDGET_USD
        value: "0.50"
      - key: REDCELL_BUDGET_USD
        value: "0.50"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Optional LangSmith tracing of public runs (run data only: no visitor IP, cookie or run code).
      # Needs the LANGSMITH_API_KEY secret; without it, or without the package, tracing stays off.
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: redcell
      - key: LANGSMITH_API_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Judge code for live runs. Set it in the dashboard only; leave it empty to disable live runs.
      - key: REDCELL_RUN_CODE
        sync: false
