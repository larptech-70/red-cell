name: RedCell Agent DevSecOps Gate

# push / pull_request: tests + an offline mock-mode scan only (no API keys, no spend).
# workflow_dispatch:   additionally a live hardened scan on Token Factory, capped at $0.25.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  agent-redteam-eval:
    name: Autonomous Agent Security Evaluation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest jsonschema

      - name: Run Test Suite
        run: python -m pytest -v

      - name: RedCell scan (offline mock, no spend)
        if: github.event_name != 'workflow_dispatch'
        env:
          NEBIUS_API_KEY: ""
          TAVILY_API_KEY: ""
        run: python scripts/run_demo.py --hardened --fail-on-breach

      - name: RedCell scan (live Nemotron on Token Factory, hardened, $0.25 cap)
        if: github.event_name == 'workflow_dispatch'
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          REDCELL_BUDGET_USD: "0.25"
        run: python scripts/run_demo.py --hardened --fail-on-breach

      # run_demo.py --hardened writes reports/report-hardened.sarif; a weak run writes reports/report.sarif.
      - name: Pick SARIF file
        id: sarif
        if: always()
        run: |
          for f in reports/report-hardened.sarif reports/report.sarif; do
            if [ -f "$f" ]; then echo "file=$f" >> "$GITHUB_OUTPUT"; break; fi
          done

      - name: Upload SARIF Security Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.sarif.outputs.file != ''
        with:
          sarif_file: ${{ steps.sarif.outputs.file }}
          category: redcell-agent-security

      - name: Generate PR Security Comment & Job Summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/pr_commenter.py --write-step-summary --output reports/pr_comment.md

      - name: Post PR Security Audit Comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/pr_commenter.py --post || echo "Note: PR comment posting skipped or token lacks write permission."
